name: Performance Benchmarks

on:
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run benchmarks
        run: |
          pnpm run benchmark:memory | tee benchmark-results.txt
          pnpm run benchmark:dns | tee -a benchmark-results.txt

          if grep -E "Heap Used: [1-9][0-9]+\.[0-9]+ MB|Duration: [2-9][0-9]{3,}" benchmark-results.txt; then
            echo "Critical performance regression detected! Memory usage exceeds 10MB or duration exceeds 2000ms."
            exit 1
          fi

          if grep -E "Heap Used: [7-9]\.[0-9]+ MB|Duration: 1[5-9][0-9]{2}" benchmark-results.txt; then
            echo "Minor performance regression detected. Consider optimizing."
          fi

      - name: Store benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-node-${{ matrix.node-version }}
          path: benchmark-results.txt

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && matrix.node-version == '26.x'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = fs.readFileSync('benchmark-results.txt', 'utf8');
              const comment = `## Performance Benchmark Results\n\n\`\`\`\n${results}\n\`\`\`\n\n> Note: These benchmarks were run on Node.js ${{ matrix.node-version }}`;
              if (context.payload.pull_request) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.name,
                  issue_number: context.payload.pull_request.number,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Error while trying to post comment:', error.message);
            }
